# Component catalog -- Nikon CFI60 ("CFI60-2") infinity system.
#
# System conventions (these are the numbers the rule checker enforces):
#   tube lens focal length : 200 mm
#   parfocal distance      : 60 mm
#   objective focal length : f = 200 / M
#
# PROVENANCE, read this before trusting a number:
#
#   [objectives.*] nominal fields -- magnification, na, working_distance_mm,
#   immersion -- are catalog specifications. They are recorded here from secondary
#   knowledge and are marked `verified = false` until each has been checked against
#   the current Nikon datasheet and the citation filled in. Anything still false is
#   plausible but must not be quoted to a student as fact.
#
#   [objectives.*.aberrations] are NOT vendor data and never will be. Manufacturers
#   do not publish Zernike budgets. They are tagged `source = "pedagogical"` so the
#   UI can say so on the inspector. They are, however, anchored to quotable figures
#   rather than invented:
#
#     spherical_rms_um        microns RMS at the entry's own NA, scaling as NA^4.
#                             Set so a plan achromat is marginally inside the
#                             Marechal diffraction limit (RMS <= lambda/14 = 39 nm)
#                             on axis at the correction wavelength, and an
#                             apochromat is comfortably inside it.
#
#     astigmatism_rms_um      microns RMS at full field, scaling as h^2 NA^2.
#
#     field_curvature_sag_um  LONGITUDINAL sag in microns at full field: how far the
#                             corner focus sits from the centre focus. A plan design
#                             holds this WELL INSIDE the depth of focus -- which at
#                             NA 0.75 is only 0.49 um, so a plan design means sub-
#                             micron sag, not "a few microns". A non-plan design of
#                             the same grade runs to tens of microns and is visibly
#                             soft at the corners. Quoted as a distance because that
#                             is how field curvature is measured.
#
#     chromatic_focus_fraction  secondary spectrum as a FRACTION OF FOCAL LENGTH
#                             across the visible band. The textbook figure for an
#                             achromat is about f/2000, i.e. 5e-4; an apochromat
#                             brings a third wavelength to common focus and is
#                             roughly an order of magnitude better. This is the
#                             number that makes round 6 work, and a student can
#                             check it in any optics text.
#
#   Both longitudinal terms convert to defocus as W020 = dz NA^2 / 2, so the same
#   physical focus error costs a high-NA objective far more -- which is why
#   chromatic correction matters most on the fastest lenses.

[system]
name = "Nikon CFI60"
tube_lens_focal_length_mm = 200.0
parfocal_distance_mm = 60.0
reference_wavelength_nm = 546.1  # e-line, the usual correction reference
verified = false

[tube_lens.cfi_tube]
label = "CFI tube lens"
focal_length_mm = 200.0
semi_diameter_mm = 13.0

