[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscopevuilder"
version = "0.1.0"
description = "A physics-based puzzle game about building a microscope"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "platformdirs>=4.0"]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
microscopevuilder = "microscopevuilder.__main__:main"

[tool.setuptools.packages.find]
include = ["microscopevuilder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
