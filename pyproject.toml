[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscopevuilder"
version = "0.1.0"
description = "A physics-based puzzle game about building a microscope"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "platformdirs>=4.0"]

[project.optional-dependencies]
# Upper bound, not caution: PySide6 6.12.0 over-decrefs None in
# QGraphicsLineItem.setPen, so redrawing the ruler a few hundred times aborts the
# process with "Fatal Python error: none_dealloc". Reproducible in twelve lines
# with no project code. Lift the bound once a release fixes it.
ui = ["PySide6>=6.6,!=6.12.0"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
microscopevuilder = "microscopevuilder.__main__:main"

[tool.setuptools.packages.find]
include = ["microscopevuilder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
